[project]
name = "my-fastapi-app"
version = "0.1.0"
description = "FastAPI application with required dependencies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.4",
    "structlog==25.4.0",
    "python-dotenv==1.1.0",
    "httpx==0.28.1",
    "langfuse==3.2.1",
    "PyYAML==6.0.3"
]

[dependency-groups]
dev = [
    "pytest==8.3.5"
]

# Thêm cấu hình này để uv biết đây là ứng dụng chạy trực tiếp, không cần build wheel
[tool.uv]
managed = true
package = false
